# ── Sarthi Kalyan — Full-Stack Docker Compose ──
# Usage:
#   Quick start (backend + frontend):  docker compose up --build
#   With ChromaDB RAG:                 docker compose --profile full up --build
#   Backend only:                      docker compose up backend

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    environment:
      - PORT=8000
      - FRONTEND_URL=http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      chromadb:
        condition: service_healthy
        required: false

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=False
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full

volumes:
  backend_data:
    driver: local
  backend_logs:
    driver: local
  chromadb_data:
    driver: local
